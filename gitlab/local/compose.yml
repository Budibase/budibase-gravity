name: budibase-gitlab-local

services:
  gitlab:
    image: gitlab/gitlab-ce@sha256:6863d156a1a477bd6f69fc674b671d0163cd8b06bf63bb17cc4a4a803b78b27c
    hostname: gitlab
    restart: unless-stopped
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 8929
        letsencrypt['enable'] = false
        gitlab_rails['gitlab_signup_enabled'] = false
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/root_password').strip
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['registry_enabled'] = false
        registry['enable'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
    ports:
      - "127.0.0.1:8929:8929"
    secrets:
      - root_password
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8929/-/readiness"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks:
      - ci

  runner:
    image: gitlab/gitlab-runner@sha256:6d4cdfe23443fa5463bffa65cba9074a4517f68784756b69bcc362ca86f3d4c6
    restart: unless-stopped
    profiles: ["runner"]
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci

secrets:
  root_password:
    file: .state/root-password

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:

networks:
  ci:
    name: budibase-gitlab-local
