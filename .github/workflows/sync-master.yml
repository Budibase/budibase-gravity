name: Mirror upstream master

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}
    steps:
      - name: Mirror only master and verify the commit
        shell: bash
        run: |
          set -euo pipefail
          gh repo sync "$TARGET_REPO" --source Budibase/budibase --branch master --force
          upstream_sha=$(gh api repos/Budibase/budibase/git/ref/heads/master --jq .object.sha)
          mirror_sha=$(gh api "repos/$TARGET_REPO/git/ref/heads/master" --jq .object.sha)
          # If upstream moved during the sync, repeat once using the captured SHA.
          if [[ "$mirror_sha" != "$upstream_sha" ]]; then
            gh api --method PATCH "repos/$TARGET_REPO/git/refs/heads/master" \
              -f sha="$upstream_sha" -F force=true --silent
            mirror_sha=$(gh api "repos/$TARGET_REPO/git/ref/heads/master" --jq .object.sha)
          fi
          test "$mirror_sha" = "$upstream_sha"
          printf 'Master mirrors upstream commit `%s`.\n' "$mirror_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Record daily health check to keep the schedule active
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          state=$(gh api "repos/$TARGET_REPO/contents/.mirror-last-checked?ref=mirror-sync")
          recorded=$(jq -r .content <<< "$state" | base64 --decode)
          if [[ "$recorded" != "$today" ]]; then
            content=$(printf '%s\n' "$today" | base64 -w 0)
            sha=$(jq -r .sha <<< "$state")
            gh api --method PUT "repos/$TARGET_REPO/contents/.mirror-last-checked" \
              -f branch=mirror-sync -f message="Record mirror health check for $today" \
              -f sha="$sha" -f content="$content" --silent
          fi
